    // --- Speech Synthesis (TTS) Helper with Natural Voice Selection ---
    const speakText = (text, onStart, onEnd) => {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Stop active speech

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ko-KR';
      utterance.rate = 0.88; // Gentle, clear pacing for better comprehension
      utterance.pitch = 1.05; // Warm, friendly tone

      // Select natural Korean voice if available in user's OS/browser
      const voices = window.speechSynthesis.getVoices();
      const koVoices = voices.filter(v => v.lang.includes('ko') || v.lang.includes('KO'));
      const preferredVoice = koVoices.find(v => 
        v.name.includes('Google') || 
        v.name.includes('Natural') || 
        v.name.includes('Heami') || 
        v.name.includes('Yuna') || 
        v.name.includes('SunHi') ||
        v.name.includes('Korean')
      ) || koVoices[0];

      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      utterance.onstart = () => { if (onStart) onStart(); };
      utterance.onend = () => { if (onEnd) onEnd(); };
      utterance.onerror = () => { if (onEnd) onEnd(); };

      window.speechSynthesis.speak(utterance);
    };

    const stopSpeaking = () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    };

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        
        if (type === 'success') {
          const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.3);
          });
        } else if (type === 'retry') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        } else if (type === 'badge') {
          if (window.confetti) {
            window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
          }
          const notes = [440, 554.37, 659.25, 880]; // A4, C#5, E5, A5
          notes.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.12);
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.4);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.12);
            osc.stop(ctx.currentTime + i * 0.12 + 0.4);
          });
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.frequency.setValueAtTime(400, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        }
      } catch (e) {
        console.log('Audio feedback unavailable', e);
      }
    };

                              key={idx}
                              onClick={() => handleStep4Choose(idx)}
                              className={`w-full p-4 rounded-2xl text-left font-bold text-base md:text-lg border-3 transition-all flex items-start gap-3 ${
                                isSelected
                                  ? opt.isCorrect
                                    ? 'bg-emerald-100 border-emerald-500 text-emerald-900 shadow-lg'
                                    : 'bg-rose-100 border-rose-400 text-rose-900'
                                  : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-800 shadow'
                              }`}
                            >
                              <span className="bg-indigo-100 text-indigo-800 rounded-full w-7 h-7 flex items-center justify-center shrink-0 text-sm">
                                {idx + 1}
                              </span>
                              <div className="flex-grow">
                                <p>{opt.text}</p>
                                {isSelected && (
                                  <p className={`text-xs mt-2 font-medium p-2 rounded-xl ${opt.isCorrect ? 'bg-emerald-200/60 text-emerald-950' : 'bg-rose-200/60 text-rose-950'}`}>
                                    💡 {opt.rationale}
                                  </p>
                                )}
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>

                    {step4Selected !== null && selectedBook.themeQuiz.options[step4Selected].isCorrect && (
                      <div className="bg-amber-100 border-2 border-amber-400 rounded-2xl p-6 text-center space-y-4">
                        <div className="text-5xl">{selectedBook.badgeIcon}</div>
                        <h4 className="font-jua text-2xl text-amber-900">축하합니다! '{selectedBook.badgeName}' 획득!</h4>
                        <p className="text-sm text-amber-800 font-medium">
                          그림책을 통해 민주시민의 소중한 가치를 성공적으로 배웠습니다.
                        </p>
                        <div className="flex justify-center gap-3 pt-2">
                          <button 
                            onClick={() => { playSound('click'); setCurrentView('library'); }}
                            className="bg-amber-500 hover:bg-amber-600 text-white font-jua text-lg px-6 py-3 rounded-2xl shadow transition-colors"
                          >
                            서재로 가서 다른 책 읽기
                          </button>
                          <button 
                            onClick={() => { playSound('click'); setCurrentView('book_report'); }}
                            className="bg-emerald-600 hover:bg-emerald-700 text-white font-jua text-lg px-6 py-3 rounded-2xl shadow transition-colors"
                          >
                            독서 감상문 쓰러 가기 ➔
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            </main>
          )}

          {}
          {currentView === 'integrated_quiz' && (
            <main className="bg-white rounded-3xl shadow-lg border-2 border-indigo-200 p-6 flex-grow flex flex-col justify-between space-y-6">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-200 mb-6">
                  <button 
                    onClick={() => { playSound('click'); setCurrentView('library'); }}
                    className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm px-4 py-2 rounded-xl transition-colors"
                  >
                    <span>←</span> 서재로 돌아가기
                  </button>
                  <h2 className="font-jua text-2xl text-indigo-900 flex items-center gap-2">
                    <span>🎯</span> 여섯 이야기 섞어 확인하기 (통합 퀴즈)
                  </h2>
                </div>

                <div className="bg-indigo-50 border-2 border-indigo-200 rounded-3xl p-6">
                  <div className="flex justify-between items-center mb-4">
                    <span className="bg-indigo-200 text-indigo-900 font-bold text-xs px-3 py-1 rounded-full">
                      문제 {integratedQuizIdx + 1} / {INTEGRATED_QUIZZES.length}
                    </span>
                    <button 
                      onClick={() => speak(INTEGRATED_QUIZZES[integratedQuizIdx].question)}
                      className="bg-indigo-200 text-indigo-900 px-3 py-1 rounded-xl text-xs font-bold"
                    >
                      🔊 문제 들어보기
                    </button>
                  </div>

                  <h3 className="font-jua text-2xl text-slate-800 mb-6 leading-relaxed">
                    Q. {INTEGRATED_QUIZZES[integratedQuizIdx].question}
                  </h3>

                  <div className="space-y-3">
                    {INTEGRATED_QUIZZES[integratedQuizIdx].options.map((opt, optIdx) => {
                      const selectedOpt = integratedAnswers[integratedQuizIdx];
                      const isSelected = selectedOpt === optIdx;
                      return (
                        <button
                          key={optIdx}
                          onClick={() => handleIntegratedChoose(integratedQuizIdx, optIdx)}
                          className={`w-full p-4 rounded-2xl text-left font-bold text-lg border-3 transition-all flex items-start gap-3 ${
                            isSelected
                              ? opt.isCorrect
                                ? 'bg-emerald-100 border-emerald-500 text-emerald-900 shadow-lg'
                                : 'bg-rose-100 border-rose-400 text-rose-900'
                              : 'bg-white border-slate-200 hover:border-indigo-300 text-slate-800 shadow'
                          }`}
                        >
                          <span className="bg-indigo-100 text-indigo-800 rounded-full w-7 h-7 flex items-center justify-center shrink-0 text-sm">
                            {optIdx + 1}
                          </span>
                          <div className="flex-grow">
                            <p>{opt.text}</p>
                            {isSelected && (
                              <p className={`text-xs mt-2 font-medium p-2 rounded-xl ${opt.isCorrect ? 'bg-emerald-200/60 text-emerald-950' : 'bg-rose-200/60 text-rose-950'}`}>
                                💡 {opt.rationale}
                              </p>
                            )}
                          </div>
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="flex justify-between items-center pt-4">
                <button
                  disabled={integratedQuizIdx === 0}
                  onClick={() => { playSound('click'); setIntegratedQuizIdx(prev => prev - 1); }}
                  className={`font-jua text-lg px-5 py-2.5 rounded-2xl border-2 ${
                    integratedQuizIdx === 0 ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed' : 'bg-white border-indigo-300 text-indigo-800 hover:bg-indigo-50'
                  }`}
                >
                  ◀ 이전 문제
                </button>

                {integratedQuizIdx < INTEGRATED_QUIZZES.length - 1 ? (
                  <button
                    disabled={integratedAnswers[integratedQuizIdx] === undefined}
                    onClick={() => { playSound('click'); setIntegratedQuizIdx(prev => prev + 1); }}
                    className={`font-jua text-lg px-6 py-2.5 rounded-2xl ${
                      integratedAnswers[integratedQuizIdx] === undefined
                        ? 'bg-slate-200 text-slate-400 cursor-not-allowed'
                        : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-md'
                    }`}
                  >
                    다음 문제 ▶
                  </button>
                ) : (
                  <button
                    disabled={integratedAnswers[integratedQuizIdx] === undefined}
                    onClick={() => {
                      unlockBadge('민주시민 퀴즈 박사 배지', '🎓', '통합 민주시민 퀴즈 완주!');
                      alert('🎉 종합 퀴즈를 모두 완료했습니다! 축하합니다!');
                    }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white font-jua text-lg px-6 py-2.5 rounded-2xl shadow-md"
                  >
                    퀴즈 결과 완성! 🏆
                  </button>
                )}
              </div>
            </main>
          )}

          {}
          {currentView === 'book_report' && (
            <main className="bg-white rounded-3xl shadow-lg border-2 border-emerald-200 p-6 flex-grow flex flex-col justify-between space-y-6">
              <div>
                <div className="flex items-center justify-between pb-4 border-b border-slate-200 mb-6">
                  <button 
                    onClick={() => { playSound('click'); setCurrentView('library'); }}
                    className="flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm px-4 py-2 rounded-xl transition-colors"
                  >
                    <span>←</span> 서재로 돌아가기
                  </button>
                  <h2 className="font-jua text-2xl text-emerald-900 flex items-center gap-2">
                    <span>✏️</span> 단어 힌트 활용 독서 감상문 쓰기
                  </h2>
                </div>

                {/* Step 1: Book Selector */}
                <div className="mb-6">
                  <label className="block font-jua text-lg text-slate-700 mb-2">
                    1. 감상문을 쓰고 싶은 그림책을 선택하세요:
                  </label>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                    {BOOKS_DATA.map((book) => (
                      <button
                        key={book.id}
                        onClick={() => { playSound('click'); setReportBook(book.id); }}
                        className={`p-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-2 border-2 transition-all ${
                          reportBook === book.id
                            ? 'bg-emerald-500 text-white border-emerald-600 shadow-md scale-102'
                            : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-emerald-50'
                        }`}
                      >
                        <span>{book.icon}</span>
                        <span className="truncate">{book.title}</span>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Step 2: Interactive Scaffolding Sentence Box */}
                <div className="bg-emerald-50 border-3 border-emerald-300 rounded-3xl p-6 shadow-inner space-y-4 mb-6">
                  <div className="flex justify-between items-center">
                    <span className="font-jua text-lg text-emerald-900">📝 내 독서 감상문 (문장 조립 중)</span>
                    <button 
                      onClick={() => {
                        const bookTitle = BOOKS_DATA.find(b => b.id === reportBook).title;
                        const fullText = `나는 ${bookTitle} 이야기를 읽었습니다. 이 책에서 ${reportSlot1 || '___'}을 보고 ${reportSlot2 || '___'}라는 생각이 들었습니다. 앞으로 나는 ${reportSlot3 || '___'}하는 민주시민이 되겠습니다.`;
                        speak(fullText);
                      }}
                      className="bg-emerald-200 text-emerald-900 px-3 py-1 rounded-xl text-xs font-bold hover:bg-emerald-300"
                    >
                      🔊 완성된 문장 읽기
                    </button>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border-2 border-emerald-200 text-lg md:text-xl font-medium leading-loose text-slate-800">
                    <span>나는 </span>
                    <span className="font-bold text-emerald-800 underline decoration-emerald-400 decoration-2 px-1">
                      [{BOOKS_DATA.find(b => b.id === reportBook).title}]
                    </span>
                    <span> 이야기를 읽었다. 이 책에서 </span>
                    
                    {/* Slot 1 */}
                    <span 
                      onClick={() => setActiveSlot(1)}
                      className={`cursor-pointer inline-block border-b-4 px-3 py-1 rounded-xl mx-1 font-bold transition-all ${
                        activeSlot === 1 
                          ? 'bg-amber-200 border-amber-500 text-amber-950 ring-2 ring-amber-300' 
                          : reportSlot1 
                          ? 'bg-emerald-100 border-emerald-400 text-emerald-900' 
                          : 'bg-slate-100 border-slate-300 text-slate-400'
                      }`}
                    >
                      {reportSlot1 || '(1. 인물/행동 터치)'}
                    </span>
                    
                    <span>을(를) 보니 </span>

                    {/* Slot 2 */}
                    <span 
                      onClick={() => setActiveSlot(2)}
                      className={`cursor-pointer inline-block border-b-4 px-3 py-1 rounded-xl mx-1 font-bold transition-all ${
                        activeSlot === 2 
                          ? 'bg-amber-200 border-amber-500 text-amber-950 ring-2 ring-amber-300' 
                          : reportSlot2 
                          ? 'bg-emerald-100 border-emerald-400 text-emerald-900' 
                          : 'bg-slate-100 border-slate-300 text-slate-400'
                      }`}
                    >
                      {reportSlot2 || '(2. 나의 느낌 터치)'}
                    </span>

                    <span>라는 생각이 들었다. 앞으로 나는 </span>

                    {/* Slot 3 */}
                    <span 
                      onClick={() => setActiveSlot(3)}
                      className={`cursor-pointer inline-block border-b-4 px-3 py-1 rounded-xl mx-1 font-bold transition-all ${
                        activeSlot === 3 
                          ? 'bg-amber-200 border-amber-500 text-amber-950 ring-2 ring-amber-300' 
                          : reportSlot3 
                          ? 'bg-emerald-100 border-emerald-400 text-emerald-900' 
                          : 'bg-slate-100 border-slate-300 text-slate-400'
                      }`}
                    >
                      {reportSlot3 || '(3. 시민 가치 터치)'}
                    </span>

                    <span>하는 민주시민이 되겠다!</span>
                  </div>
                </div>

                {/* Step 3: Word Bank Chips Categorized */}
                <div className="bg-slate-50 border-2 border-slate-200 rounded-3xl p-5 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="font-jua text-base text-slate-700">
                      💡 도움 단어 칩 (원하는 단어를 터치하면 빈칸에 자동으로 들어갑니다)
                    </span>
                    <span className="text-xs font-bold text-amber-800 bg-amber-100 px-2 py-1 rounded-lg">
                      현재 선택된 빈칸: [{activeSlot === 1 ? '1. 인물/행동' : activeSlot === 2 ? '2. 나의 느낌' : '3. 시민 가치'}]
                    </span>
                  </div>

                  <div className="space-y-3">
                    <div>
                      <p className="text-xs font-bold text-slate-500 mb-1">인물 / 행동 단어:</p>
                      <div className="flex flex-wrap gap-2">
                        {WORD_BANK.person.concat(WORD_BANK.action).map((word, i) => (
                          <button
                            key={i}
                            onClick={() => {
                              playSound('click');
                              setReportSlot1(word);
                              setActiveSlot(2);
                            }}
                            className="bg-white hover:bg-amber-100 border-2 border-amber-300 text-slate-800 font-bold text-sm px-3 py-1.5 rounded-xl shadow-sm transition-all transform active:scale-95"
                          >
                            + {word}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <p className="text-xs font-bold text-slate-500 mb-1">나의 느낌 단어:</p>
                      <div className="flex flex-wrap gap-2">
                        {WORD_BANK.feeling.map((word, i) => (
                          <button
                            key={i}
                            onClick={() => {
                              playSound('click');
                              setReportSlot2(word);
                              setActiveSlot(3);
                            }}
                            className="bg-white hover:bg-indigo-100 border-2 border-indigo-300 text-slate-800 font-bold text-sm px-3 py-1.5 rounded-xl shadow-sm transition-all transform active:scale-95"
                          >
                            + {word}
                          </button>
                        ))}
                      </div>
                    </div>

                    <div>
                      <p className="text-xs font-bold text-slate-500 mb-1">민주시민 가치 단어:</p>
                      <div className="flex flex-wrap gap-2">
                        {WORD_BANK.citizenValue.map((word, i) => (
                          <button
                            key={i}
                            onClick={() => {
                              playSound('click');
                              setReportSlot3(word);
                            }}
                            className="bg-white hover:bg-emerald-100 border-2 border-emerald-300 text-slate-800 font-bold text-sm px-3 py-1.5 rounded-xl shadow-sm transition-all transform active:scale-95"
                          >
                            + {word}
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="pt-4 flex justify-end">
                <button
                  onClick={handleSaveReport}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white font-jua text-xl px-8 py-3.5 rounded-2xl shadow-lg transition-transform transform active:scale-95 flex items-center gap-2"
                >
                  <span>🎉</span>
                  <span>독서 감상문 완성하고 배지 받기</span>
                </button>
              </div>

              {savedReports.length > 0 && (
                <div className="pt-6 border-t border-slate-200">
                  <h4 className="font-jua text-xl text-slate-800 mb-3">📜 내가 완성한 감상문 포트폴리오</h4>
                  <div className="space-y-3">
                    {savedReports.map((rep) => (
                      <div key={rep.id} className="bg-amber-50/60 border border-amber-200 p-4 rounded-2xl">
                        <div className="flex justify-between items-center mb-2">
                          <span className="font-bold text-amber-900">{rep.bookTitle}</span>
                          <span className="text-xs text-slate-400">{rep.date}</span>
                        </div>
                        <p className="text-sm text-slate-700 font-medium leading-relaxed">{rep.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          )}

          {}
          {showBadgeModal && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
              <div className="bg-white border-4 border-amber-400 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl relative space-y-4 transform scale-105 transition-transform">
                <div className="text-7xl bounce-gentle">{showBadgeModal.icon}</div>
                <span className="bg-amber-100 text-amber-900 font-bold text-xs px-3 py-1 rounded-full inline-block">
                  새로운 배지 획득!
                </span>
                <h3 className="font-jua text-2xl text-slate-800">{showBadgeModal.name}</h3>
                <p className="text-sm text-slate-600">{showBadgeModal.desc}</p>
                <button
                  onClick={() => { playSound('click'); setShowBadgeModal(null); }}
                  className="w-full bg-amber-500 hover:bg-amber-600 text-white font-jua text-lg py-3 rounded-2xl shadow transition-colors"
                >
                  멋져요! 확인
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-8 text-center text-xs text-slate-400 font-medium py-4">
            생각 쑥쑥 시민 학교 — 느린 학습자를 위한 전래동화 그림책 기반 민주시민 역량 강화 웹앱
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
